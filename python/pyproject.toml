[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmsim"
version = "0.1.0"
description = "LLM prefix-KV-cache and RAG-pipeline cost simulation"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
]

[project.scripts]
llmsim = "llmsim.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "hypothesis==6.131.15",
]
